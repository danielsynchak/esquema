<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página em Manutenção | La Redoute Style</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf9f7;
            color: #1a1a1a;
        }

        .error-container {
            max-width: 520px;
            text-align: center;
            padding: 40px 30px;
        }

        .error-code {
            font-size: 7rem;
            font-weight: 700;
            letter-spacing: 6px;
            color: #2b2b2b;
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin: 10px 0 15px;
        }

        .error-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 30px;
            background: #000;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-home:hover {
            background: #333;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: #000;
            margin: 25px auto;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body>

    <main class="error-container">
        <div class="error-code">404</div>

        <div class="divider"></div>

        <h1 class="error-title">Página em manutenção</h1>

        <p class="error-text">
            Esta página ainda está a ser preparada.  
            Estamos a trabalhar para lhe oferecer a melhor experiência.
        </p>

        <a href="index.html" class="btn-home">Voltar à página inicial</a>
    </main>

</body>
</html>
